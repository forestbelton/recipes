name: Skillet Pasta with Sausage & Greens
source: ""
prep_time_minutes: 25
cook_time_minutes: 15
additional_time_minutes: 0
servings: 2
ingredients:
  - name: Italian sausage, bulk or removed from casings
    amount: 8
    unit: oz
  - name: pasta (penne, rigatoni, or short pasta)
    amount: 8
    unit: oz
  - name: spinach or other hearty greens
    amount: 3
    unit: cups
  - name: garlic, minced
    amount: 4
    unit: cloves
  - name: chicken broth
    amount: 2
    unit: cups
  - name: heavy cream or half-and-half
    amount: 0.5
    unit: cup
  - name: grated Parmesan cheese
    amount: 0.25
    unit: cup
  - name: salt and pepper
    amount: N/A
    unit: ""
  - name: red pepper flakes (optional)
    amount: N/A
    unit: ""
  - name: olive oil
    amount: 1
    unit: tbsp
steps:
  - Heat olive oil in a large skillet over medium-high heat.
  - Brown sausage, breaking it apart as it cooks (5-7 minutes). Drain excess fat if needed.
  - Add garlic and cook 1 minute until fragrant.
  - Add pasta and broth to the skillet, bring to a boil.
  - Reduce heat and simmer for 10-12 minutes, stirring occasionally, until pasta is al dente.
  - Stir in greens and cook until wilted (2-3 minutes).
  - Remove from heat, stir in cream and Parmesan.
  - Season with salt, pepper, and red pepper flakes to taste.
