name: Thai Curry with Chicken
source: ""
prep_time_minutes: 20
cook_time_minutes: 15
additional_time_minutes: 0
servings: 2
ingredients:
  - name: chicken breast, cut into bite-sized pieces
    amount: 1
    unit: lb
  - name: coconut milk
    amount: 13.5
    unit: oz
  - name: red or yellow curry paste
    amount: 3.5
    unit: tbsp
  - name: bell pepper, cut into chunks
    amount: 1
    unit: ""
  - name: onion, cut into chunks
    amount: 1
    unit: ""
  - name: spinach or other greens (optional)
    amount: 2
    unit: cups
  - name: fish sauce
    amount: 1
    unit: tbsp
  - name: brown sugar
    amount: 1
    unit: tbsp
  - name: lime juice
    amount: 1
    unit: ""
  - name: fresh basil or cilantro (optional)
    amount: N/A
    unit: ""
  - name: jasmine rice
    amount: 2
    unit: cups
steps:
  - Heat 1 tbsp of coconut milk in a large pan or wok over medium-high heat.
  - Add curry paste and cook 1-2 minutes, stirring constantly, until fragrant.
  - Add chicken and cook 3-4 minutes until lightly browned.
  - Pour in remaining coconut milk, fish sauce, and brown sugar. Stir well.
  - Add bell pepper and onion, simmer for 10-12 minutes until chicken is cooked through and peppers are tender.
  - Add spinach/greens if using, cook until wilted (1-2 minutes).
  - Finish with lime juice and taste for seasoning.
  - Serve over jasmine rice, garnish with fresh basil or cilantro if available.
